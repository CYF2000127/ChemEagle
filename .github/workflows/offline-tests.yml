name: Offline extraction tests

on: [pull_request, push]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==9.2.0 rdkit==2026.9.2
      - run: python -m pytest -q
